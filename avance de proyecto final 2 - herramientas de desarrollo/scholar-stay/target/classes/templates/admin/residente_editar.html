<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Editar Residente - Scholar Stay Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
          theme: { extend: { colors: {
            "primary": "#3d637e", "on-primary": "#f5f9ff", "primary-dim": "#305771",
            "primary-container": "#b8dffe", "on-primary-container": "#29506a",
            "secondary": "#46674b", "secondary-container": "#c7ecc9", "on-secondary-container": "#39593f",
            "surface": "#f8fafa", "surface-container-low": "#f0f4f4",
            "surface-container-high": "#e3e9ea", "surface-container-lowest": "#ffffff",
            "on-surface": "#2c3435", "on-surface-variant": "#596061",
            "outline": "#757c7d", "outline-variant": "#acb3b4", "error": "#a83836",
          }, fontFamily: { "headline": ["Manrope"] } } }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .editorial-shadow { box-shadow: 0 4px 24px rgba(44,52,53,0.06); }
        input:focus { outline: none; ring: 2px; }
    </style>
</head>
<body class="bg-surface text-on-surface">

<!-- Sidebar -->
<aside class="h-screen w-64 fixed left-0 top-0 bg-slate-100 flex flex-col p-6 gap-2 z-40 border-r border-slate-200">
    <div class="mb-8">
        <h1 class="text-xl font-extrabold text-sky-900 tracking-tighter">Scholar Stay</h1>
        <p class="text-[10px] uppercase tracking-widest text-outline mt-1">Admin Portal</p>
        <div class="mt-5 flex items-center gap-3 p-3 bg-white rounded-xl shadow-sm">
            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary font-bold text-sm"
                 th:text="${admin != null ? admin.nombre.substring(0,1) : 'A'}">A</div>
            <div>
                <p class="font-bold text-sm text-sky-900 leading-tight" th:text="${admin != null ? admin.nombre : 'Administrador'}">Admin</p>
                <p class="text-[10px] text-outline">Gestión Académica</p>
            </div>
        </div>
    </div>
    <nav class="flex flex-col gap-1 flex-1 font-headline text-sm font-semibold">
        <a class="flex items-center gap-3 text-slate-500 px-4 py-3 hover:bg-slate-200/50 rounded-xl transition-all" th:href="@{/admin/dashboard}">
            <span class="material-symbols-outlined">dashboard</span><span>Panel Control</span>
        </a>
        <a class="flex items-center gap-3 bg-white text-primary rounded-xl px-4 py-3 shadow-sm" th:href="@{/admin/residentes}">
            <span class="material-symbols-outlined filled">group</span><span>Residentes</span>
        </a>
        <a class="flex items-center gap-3 text-slate-500 px-4 py-3 hover:bg-slate-200/50 rounded-xl transition-all" th:href="@{/admin/propiedades}">
            <span class="material-symbols-outlined">apartment</span><span>Propiedades</span>
        </a>
        <a class="flex items-center gap-3 text-slate-500 px-4 py-3 hover:bg-slate-200/50 rounded-xl transition-all" th:href="@{/admin/finanzas}">
            <span class="material-symbols-outlined">payments</span><span>Finanzas</span>
        </a>
    </nav>
    <div class="flex flex-col gap-1 font-headline text-sm font-semibold border-t border-slate-200 pt-4">
        <a class="flex items-center gap-3 text-error px-4 py-2 hover:bg-red-50 rounded-xl transition-all" th:href="@{/logout}">
            <span class="material-symbols-outlined">logout</span><span>Cerrar Sesión</span>
        </a>
    </div>
</aside>

<!-- Main -->
<main class="ml-64 p-8 min-h-screen">

    <!-- Back -->
    <div class="mb-8">
        <a th:href="@{/admin/residentes/{id}(id=${residente.id})}"
           class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors text-sm font-semibold">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            Volver al detalle de <span class="ml-1" th:text="${residente.nombre}">Residente</span>
        </a>
    </div>

    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl editorial-shadow p-10">
            <!-- Header -->
            <div class="flex items-center gap-5 mb-8 pb-8 border-b border-surface-container-high">
                <div class="w-16 h-16 rounded-2xl bg-secondary-container flex items-center justify-center text-on-secondary-container font-headline font-extrabold text-3xl"
                     th:text="${residente.nombre.substring(0,1)}">U</div>
                <div>
                    <h1 class="text-2xl font-headline font-extrabold text-on-surface tracking-tight">Editar Residente</h1>
                    <p class="text-on-surface-variant text-sm" th:text="${'ID #' + residente.id}">ID</p>
                </div>
            </div>

            <!-- Edit Form -->
            <form th:action="@{/admin/residentes/{id}/editar(id=${residente.id})}"
                  method="post"
                  class="space-y-6">

                <!-- Nombre -->
                <div>
                    <label for="nombre"
                           class="block text-[10px] font-bold uppercase tracking-widest text-outline mb-2">
                        Nombre Completo
                    </label>
                    <input type="text"
                           id="nombre"
                           name="nombre"
                           th:value="${residente.nombre}"
                           required
                           class="w-full bg-surface-container-low border border-outline-variant/40 text-on-surface text-sm rounded-xl px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"/>
                </div>

                <!-- Email -->
                <div>
                    <label for="email"
                           class="block text-[10px] font-bold uppercase tracking-widest text-outline mb-2">
                        Correo Electrónico
                    </label>
                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${residente.email}"
                           required
                           class="w-full bg-surface-container-low border border-outline-variant/40 text-on-surface text-sm rounded-xl px-4 py-3 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"/>
                </div>

                <!-- Info Rol (solo lectura) -->
                <div th:if="${residente.rol != null}">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-outline mb-2">Rol</label>
                    <div class="bg-surface-container-high rounded-xl px-4 py-3 text-sm text-on-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">lock</span>
                        <span th:text="${residente.rol.nombre}">ROL</span>
                        <span class="text-[10px] ml-auto text-outline">(solo lectura)</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-4 pt-4 border-t border-surface-container-high">
                    <button type="submit"
                            class="flex-1 bg-primary text-on-primary py-3 rounded-xl font-headline font-bold text-sm hover:bg-primary-dim transition-colors flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">save</span>
                        Guardar Cambios
                    </button>
                    <a th:href="@{/admin/residentes/{id}(id=${residente.id})}"
                       class="flex-1 text-center bg-surface-container-high text-on-surface-variant py-3 rounded-xl font-headline font-bold text-sm hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">cancel</span>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
