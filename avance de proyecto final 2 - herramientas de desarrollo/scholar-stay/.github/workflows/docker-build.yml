# =============================================================================
# WORKFLOW: Verificar Build de Docker
# PROPÓSITO: Confirma que el Dockerfile construye correctamente la imagen.
#            Detecta problemas en la imagen ANTES de llegar a producción.
#            Solo se ejecuta cuando cambian archivos relevantes para Docker.
# TRIGGER: Push a main/develop cuando cambia Dockerfile, docker-compose o pom.xml
# =============================================================================

name: Verificar Build Docker

on:
  push:
    branches:
      - "**"
    paths:
      # Solo se activa si cambia alguno de estos archivos.
      # Si solo cambia un HTML o un CSS, este workflow NO corre (ahorra minutos).
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pom.xml'
      - 'src/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pom.xml'
      - 'src/**'

jobs:
  docker-build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------
      # 1. Descarga el código
      # -----------------------------------------------------------------
      - name: Checkout del código
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Configura Docker Buildx (builder moderno con soporte de cache)
      # -----------------------------------------------------------------
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------
      # 3. Construye la imagen Docker sin subir al registry.
      #    "load: true" hace la imagen disponible localmente en el runner.
      #    Si el Dockerfile tiene errores, aquí falla.
      #    El Dockerfile de Scholar Stay es multi-stage (builder + runner),
      #    así que también valida que ambas stages funcionen.
      # -----------------------------------------------------------------
      - name: Build de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false       # Solo construir, NO subir a ningún registry
          load: true        # Cargar imagen en Docker local del runner
          tags: scholar-stay:test
          # Cache de capas Docker entre runs para acelerar builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------
      # 4. Verifica que la imagen construida existe y tiene el tag correcto.
      #    Es una validación simple pero confirma que el step anterior
      #    completó satisfactoriamente.
      # -----------------------------------------------------------------
      - name: Verificar imagen construida
        run: |
          echo "Imagen construida exitosamente:"
          docker images scholar-stay:test
          echo "Tamaño de la imagen:"
          docker inspect scholar-stay:test --format='{{.Size}}' | awk '{print $1/1024/1024 " MB"}'