services:
  db:
    image: mysql:8.0
    container_name: scholar-stay-db
    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_DATABASE: convivest_db
      MYSQL_ROOT_PASSWORD: soldepiura

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - scholar-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: scholar-stay-app
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: convivest_db
      DB_USERNAME: root
      DB_PASSWORD: soldepiura

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - scholar-network


volumes:
  mysql_data:
    driver: local

networks:
  scholar-network:
    driver: bridge