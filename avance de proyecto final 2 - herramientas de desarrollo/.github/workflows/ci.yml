# =============================================================================
# WORKFLOW: CI - Build y Tests
# PROPÓSITO: Verifica que el proyecto compila y los tests pasan en cada push
#            o Pull Request. Es la red de seguridad base del proyecto.
# TRIGGER: Cada push a main/develop y cada Pull Request hacia main
# =============================================================================

name: CI - Build y Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Compilar y ejecutar tests
    runs-on: ubuntu-latest
    
    defaults: 
      run: 
        working-directory: scholar-stay

    steps:
      # -----------------------------------------------------------------
      # 1. Descarga el código del repositorio en el runner de GitHub
      # -----------------------------------------------------------------
      - name: Checkout del código
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Instala Java 17 (misma versión que usa el proyecto en pom.xml)
      # -----------------------------------------------------------------
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # -----------------------------------------------------------------
      # 3. Cachea las dependencias de Maven para acelerar builds futuros.
      #    Sin cache: ~3-4 min. Con cache: ~30-60 seg en el segundo run.
      # -----------------------------------------------------------------
      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # -----------------------------------------------------------------
      # 4. Compila el proyecto. -B = batch mode (sin colores/interacción).
      #    Si hay errores de compilación, el workflow falla aquí.
      # -----------------------------------------------------------------
      - name: Compilar el proyecto
        run: mvn compile -B

      # -----------------------------------------------------------------
      # 5. Ejecuta los tests unitarios (JUnit + Mockito).
      #    Estos tests NO necesitan base de datos porque usan @Mock.
      #    Si algún test falla, el workflow falla y NO se mergea el PR.
      # -----------------------------------------------------------------
      - name: Ejecutar tests unitarios
        run: mvn test -B

      # -----------------------------------------------------------------
      # 6. Sube el reporte de tests para verlo en la UI de GitHub Actions.
      #    Se ejecuta siempre (incluso si los tests fallan) para poder
      #    diagnosticar cuáles tests fallaron.
      # -----------------------------------------------------------------
      - name: Publicar reporte de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-tests
          path: scholar-stay/target/surefire-reports/
          retention-days: 7