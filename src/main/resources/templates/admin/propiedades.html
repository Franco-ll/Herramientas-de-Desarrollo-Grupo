<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Propiedades | Scholar Stay</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div th:replace="~{fragments/admin/sidebar :: sidebar('propiedades')}"></div>

        <!-- CONTENIDO -->
        <main class="col-12 col-lg-10 content">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                <div>
                    <h2 class="fw-bold">Gestión de Propiedades</h2>
                    <p class="text-muted">Administra los cuartos y residencias disponibles</p>
                </div>

                <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalPropiedad">
                    <i class="bi bi-plus-circle"></i> Nueva Propiedad
                </button>

            </div>

            <!-- FILTROS -->
            <div class="row g-3 mb-4">

                <div class="col-md-4">
                    <select class="form-select">
                        <option>Todas las zonas</option>
                        <option>Centro</option>
                        <option>Universidad</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <select class="form-select">
                        <option>Cualquier estado</option>
                        <option>Disponible</option>
                        <option>Ocupado</option>
                    </select>
                </div>

                <div class="col-md-4 text-end">
                    <button class="btn btn-outline-secondary">
                        Limpiar filtros
                    </button>
                </div>

            </div>

            <!-- CARDS -->
            <div class="row g-4">

                <div class="col-md-6 col-xl-4" th:each="p : ${propiedades}">
                    <div class="property-card">

                        <!-- Imagen -->
                        <div class="property-img">
                            <span class="badge bg-success"
                                  th:if="${p.estado == 'Disponible'}">Disponible</span>

                            <span class="badge bg-secondary"
                                  th:if="${p.estado == 'Ocupado'}">Ocupado</span>
                        </div>

                        <!-- Info -->
                        <div class="property-body">

                            <h5 th:text="${p.nombre}">Residencia</h5>

                            <p class="text-muted mb-1">
                                <i class="bi bi-geo-alt"></i>
                                <span th:text="${p.ubicacion}">Ubicación</span>
                            </p>

                            <small class="text-muted" th:text="${p.tipo}">Tipo</small>

                            <div class="d-flex justify-content-between align-items-center mt-3">

                                <strong class="price">
                                    S/ <span th:text="${p.precio}">850</span>
                                </strong>

                                <div class="actions">
                                    <button class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i>
                                    </button>

                                    <button class="btn btn-sm btn-outline-warning">
                                        <i class="bi bi-pencil"></i>
                                    </button>

                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>

                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalPropiedad">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Nueva Propiedad</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form>
                    <input class="form-control mb-2" placeholder="Nombre">
                    <input class="form-control mb-2" placeholder="Ubicación">
                    <input class="form-control mb-2" placeholder="Tipo">
                    <input class="form-control mb-2" placeholder="Precio">

                    <select class="form-select mb-3">
                        <option>Disponible</option>
                        <option>Ocupado</option>
                    </select>

                    <button class="btn btn-primary w-100">
                        Guardar
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>

</body>
</html>
